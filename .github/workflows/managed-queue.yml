name: Bounded managed backend queue acceptance
on:
  workflow_dispatch:
  push:
    branches: [dev/telemt-stable-compat-20261107]
    paths: [.github/workflows/managed-queue.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: managed-backend-queue
  cancel-in-progress: false
jobs:
  lifecycle:
    runs-on: ubuntu-22.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable lifecycle tools
        run: |
          sudo timeout 120 apt-get update -qq
          sudo timeout 180 apt-get install -y --no-install-recommends iproute2 wireguard-tools python3-cryptography
          mkdir -m 700 "$RUNNER_TEMP/queue-lifecycle"
          python3 tools/embed_queue.py --check
          sudo timeout 30 python3 -m unittest discover -s tests -p 'test_queue_control.py' -v
      - name: Real wg-quick hooks, crash recovery and drift rejection
        run: |
          sudo systemd-run --quiet --wait --pipe --collect --unit="tdh-paired-queue-life-${GITHUB_RUN_ID}" -p CPUQuota=200% -p MemoryMax=512M -p MemorySwapMax=0 -p TasksMax=128 -p RuntimeMaxSec=240 -p "WorkingDirectory=$GITHUB_WORKSPACE" --setenv=GITHUB_ACTIONS=true --setenv="TDH_SOURCE_COMMIT=$GITHUB_SHA" unshare --net -- bash -c 'ip link set lo up; exec python3 tests/queue_control_lab.py --output "$1"' queue "$RUNNER_TEMP/queue-lifecycle/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: queue-lifecycle
          path: ${{ runner.temp }}/queue-lifecycle/*.json
          retention-days: 14
  measure:
    needs: lifecycle
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact existing binaries without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 42495175073 --repo bababoyi6/me --json headSha --jq .headSha)" = dec285fbdf5b42dd8be3e9e879bc0c2ad8994bc8
          timeout 90 gh run download 42495175073 --repo bababoyi6/me --name native-pair --dir "$RUNNER_TEMP/native-pair"
          timeout 90 gh api -H 'Accept: application/octet-stream' repos/bababoyi6/me/releases/assets/672609415 > "$RUNNER_TEMP/balanced2.tar.gz"
          timeout 90 gh api -H 'Accept: application/octet-stream' repos/telemt/telemt/releases/assets/723821981 > "$RUNNER_TEMP/stable.tar.gz"
          printf '%s  %s\n' b4fec3efd10288a9f211ad958337fa314a15486e72fd5c50ab870f22a19737e5 "$RUNNER_TEMP/balanced2.tar.gz" 0570762ddcd79530d666b09e955b955bb52c9e134cc8b8ed1a0f50ad28d58a0e "$RUNNER_TEMP/stable.tar.gz" | sha256sum --check
      - name: Prepare bounded private path
        run: |
          sudo timeout 120 apt-get update -qq
          sudo timeout 180 apt-get install -y --no-install-recommends haproxy iproute2 wireguard-tools ethtool iperf3 python3-cryptography
          sudo modprobe tcp_bbr
          mkdir -m 700 "$RUNNER_TEMP/managed-queue"
      - name: Test actual backend-only controller, unchanged entry and fixed original gates
        run: |
          sudo systemd-run --quiet --wait --pipe --collect --unit="tdh-paired-managed-${GITHUB_RUN_ID}" -p CPUQuota=300% -p MemoryMax=1536M -p MemoryHigh=1200M -p MemorySwapMax=0 -p TasksMax=512 -p RuntimeMaxSec=780 -p OOMPolicy=stop -p "WorkingDirectory=$GITHUB_WORKSPACE" --setenv=GITHUB_ACTIONS=true --setenv="TDH_SOURCE_COMMIT=$GITHUB_SHA" python3 tests/mixed_path_lab.py --queue-screen --queue-core native17 --managed-backend-queue --profile rtt100 --balanced2-archive "$RUNNER_TEMP/balanced2.tar.gz" --stable-archive "$RUNNER_TEMP/stable.tar.gz" --native-directory "$RUNNER_TEMP/native-pair" --output "$RUNNER_TEMP/managed-queue/metrics.json"
          python3 tests/private_shaper_analysis.py "$RUNNER_TEMP/managed-queue/metrics.json" "$RUNNER_TEMP/managed-queue/analysis.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-queue
          path: ${{ runner.temp }}/managed-queue/*.json
          retention-days: 14
