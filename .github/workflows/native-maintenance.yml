name: Qualify native candidate lifecycle and bounded memory
on:
  workflow_dispatch:
  push:
    branches: [dev/telemt-stable-compat-20261107]
    paths:
      - .github/workflows/native-maintenance.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: native-maintenance
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable dependencies and exact tested core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo timeout 120 apt-get update -qq
          sudo timeout 180 apt-get install -y --no-install-recommends haproxy iproute2 python3-cryptography
          mkdir -m 700 "$RUNNER_TEMP/native-maintenance"
          gh run download 42456468710 --repo bababoyi6/me --name native-pair --dir "$RUNNER_TEMP/native-pair"
          printf '%s  %s\n' d0265d1c919966173339f2d9314c76048608b6b099d0a2e9e9ee33053651bc61 "$RUNNER_TEMP/native-pair/telemt-balanced" | sha256sum --check
          curl -q -fL --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 120 --max-filesize 67108864 https://github.com/bababoyi6/me/releases/download/telemt-core-3.5.5-tdh.balanced2/telemt-3.5.5-tdh.balanced2-x86_64-linux-gnu.tar.gz -o "$RUNNER_TEMP/balanced2.tar.gz"
      - name: Verify actual systemd candidate upgrade crash recovery and reverse rollback
        run: |
          sudo env GITHUB_ACTIONS=true timeout --kill-after=10 240 unshare --net sh -c 'ip link set lo up; exec python3 tests/stable_system_lab.py --candidate-directory "$1/native-pair" --balanced2-archive "$1/balanced2.tar.gz" --output "$1/native-maintenance/system.json"' native "$RUNNER_TEMP"
      - name: Verify 30 50 100 concurrent flows inside one CPU and 768MiB budget
        run: |
          sudo systemd-run --quiet --wait --pipe --collect --unit="tdh-paired-nativepressure-${GITHUB_RUN_ID}" -p CPUQuota=100% -p MemoryMax=768M -p MemoryHigh=640M -p MemorySwapMax=0 -p TasksMax=512 -p RuntimeMaxSec=180 -p OOMPolicy=stop -p "WorkingDirectory=$GITHUB_WORKSPACE" --setenv="GITHUB_ACTIONS=true" --setenv="TDH_SOURCE_COMMIT=$GITHUB_SHA" unshare --net -- bash -c 'ip link set lo up; tc qdisc add dev lo root netem delay 25ms rate 100mbit limit 10000; exec python3 tests/native_socket_acceptance.py --directory "$1" --output "$2"' native "$RUNNER_TEMP/native-pair" "$RUNNER_TEMP/native-maintenance/pressure.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-maintenance-evidence
          path: ${{ runner.temp }}/native-maintenance/*.json
          if-no-files-found: warn
          retention-days: 14
