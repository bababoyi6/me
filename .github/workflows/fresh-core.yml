name: Bounded fresh core selection
on:
  workflow_dispatch:
  push:
    branches: [dev/telemt-stable-compat-20261107]
    paths: [.github/workflows/fresh-core.yml]
permissions:
  contents: read
concurrency:
  group: fresh-core-selection
  cancel-in-progress: false
jobs:
  selection:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Prepare bounded dependencies and service identity
        run: |
          sudo timeout 120 apt-get update -qq
          sudo timeout 180 apt-get install -y --no-install-recommends haproxy python3-cryptography iproute2
          if ! id telemt >/dev/null 2>&1; then sudo useradd --system --no-create-home --shell /usr/sbin/nologin telemt; fi
          mkdir -m 700 "$RUNNER_TEMP/fresh-core"
      - name: Fetch released bytes from actual pinned public installation URLs
        run: |
          set -euo pipefail
          curl -q -fL --connect-timeout 10 --max-time 90 --max-filesize 67108864 --proto '=https' --proto-redir '=https' --tlsv1.2 https://github.com/bababoyi6/me/releases/download/telemt-core-3.5.5-tdh.balanced2/telemt-3.5.5-tdh.balanced2-x86_64-linux-gnu.tar.gz -o "$RUNNER_TEMP/balanced2.tar.gz"
          curl -q -fL --connect-timeout 10 --max-time 90 --max-filesize 67108864 --proto '=https' --proto-redir '=https' --tlsv1.2 https://github.com/telemt/telemt/releases/download/3.5.17/telemt-x86_64-linux-gnu.tar.gz -o "$RUNNER_TEMP/official.tar.gz"
          printf '%s  %s\n' b4fec3efd10288a9f211ad958337fa314a15486e72fd5c50ab870f22a19737e5 "$RUNNER_TEMP/balanced2.tar.gz" 0570762ddcd79530d666b09e955b955bb52c9e134cc8b8ed1a0f50ad28d58a0e "$RUNNER_TEMP/official.tar.gz" | sha256sum --check
      - name: Verify default and explicit real install, both links, auth and refusal boundaries
        run: |
          sudo systemd-run --quiet --wait --pipe --collect --unit="tdh-paired-fresh-core-${GITHUB_RUN_ID}" -p CPUQuota=100% -p MemoryMax=512M -p MemorySwapMax=0 -p TasksMax=128 -p RuntimeMaxSec=180 -p "WorkingDirectory=$GITHUB_WORKSPACE" --setenv=GITHUB_ACTIONS=true --setenv="TDH_SOURCE_COMMIT=$GITHUB_SHA" unshare --net -- sh -c 'ip link set lo up; exec python3 tests/fresh_core_lab.py --balanced2-archive "$1/balanced2.tar.gz" --official-archive "$1/official.tar.gz" --output "$1/fresh-core/result.json"' lab "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-core-evidence
          path: ${{ runner.temp }}/fresh-core/*.json
          retention-days: 14
