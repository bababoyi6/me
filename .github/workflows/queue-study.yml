name: Bounded joint throughput and queue latency study
on:
  workflow_dispatch:
    inputs:
      layout:
        description: Counterfactuals or equal offered-load mechanism check
        type: choice
        default: candidates
        options: [candidates, equal-load]
permissions:
  contents: read
  actions: read
concurrency:
  group: private-queue-study
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-22.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - name: Require the immutable reviewed native build and wait within a bound
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 42495175073 --repo bababoyi6/me --json headSha --jq .headSha)" = dec285fbdf5b42dd8be3e9e879bc0c2ad8994bc8
          ready=false
          for attempt in $(seq 1 60); do
            state=$(gh run view 42495175073 --repo bababoyi6/me --json jobs --jq '.jobs[] | select(.name=="build") | .conclusion')
            if [ "$state" = success ]; then ready=true; break; fi
            if [ -n "$state" ]; then echo 'Pinned build did not pass'; exit 1; fi
            sleep 15
          done
          test "$ready" = true
          gh run download 42495175073 --repo bababoyi6/me --name native-pair --dir "$RUNNER_TEMP/native-pair"
      - name: Prepare bounded disposable dependencies and verify socket oracle
        run: |
          sudo timeout 120 apt-get update -qq
          sudo timeout 180 apt-get install -y --no-install-recommends haproxy iproute2 wireguard-tools ethtool iperf3 python3-cryptography
          cc -shared -fPIC -Wall -Wextra -Werror tests/socket_policy_lab.c -ldl -o "$RUNNER_TEMP/socket-policy.so"
          timeout 20 python3 tests/policy_oracle.py --library "$RUNNER_TEMP/socket-policy.so"
          mkdir -m 700 "$RUNNER_TEMP/queue-evidence"
      - name: Measure balanced counterfactuals only inside owned namespaces
        env:
          STUDY_LAYOUT: ${{ inputs.layout }}
        run: |
          flags=(--queue-study)
          analyzer=tests/queue_analysis.py
          if [ "$STUDY_LAYOUT" = equal-load ]; then flags=(--equal-load-study); analyzer=tests/long_path_analysis.py; fi
          sudo systemd-run --quiet --wait --pipe --collect --unit="tdh-paired-queue-${GITHUB_RUN_ID}" -p CPUQuota=300% -p MemoryMax=1536M -p MemoryHigh=1200M -p MemorySwapMax=0 -p TasksMax=512 -p RuntimeMaxSec=900 -p OOMPolicy=stop -p "WorkingDirectory=$GITHUB_WORKSPACE" --setenv="GITHUB_ACTIONS=true" --setenv="TDH_SOURCE_COMMIT=$GITHUB_SHA" python3 tests/long_path_lab.py "${flags[@]}" --native-directory "$RUNNER_TEMP/native-pair" --output "$RUNNER_TEMP/queue-evidence/metrics.json"
          python3 "$analyzer" "$RUNNER_TEMP/queue-evidence/metrics.json" "$RUNNER_TEMP/queue-evidence/analysis.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: queue-study-evidence
          path: ${{ runner.temp }}/queue-evidence/*.json
          retention-days: 14
