name: Bounded path capacity calibration
on:
  workflow_dispatch:
  push:
    branches: [dev/telemt-stable-compat-20261107]
    paths: [.github/workflows/path-capacity.yml]
permissions:
  contents: read
concurrency:
  group: path-capacity-calibration
  cancel-in-progress: false
jobs:
  calibrate:
    runs-on: ubuntu-22.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable network tools
        run: |
          sudo timeout 120 apt-get update -qq
          sudo timeout 180 apt-get install -y --no-install-recommends iproute2 wireguard-tools ethtool iperf3 python3-cryptography
          sudo modprobe tcp_bbr
          mkdir -m 700 "$RUNNER_TEMP/capacity-evidence"
      - name: Eight bounded TCP controls; no core build or public load
        run: |
          sudo systemd-run --quiet --wait --pipe --collect --unit="tdh-paired-capacity-${GITHUB_RUN_ID}" -p CPUQuota=300% -p MemoryMax=1536M -p MemoryHigh=1200M -p MemorySwapMax=0 -p TasksMax=128 -p RuntimeMaxSec=180 -p OOMPolicy=stop -p "WorkingDirectory=$GITHUB_WORKSPACE" --setenv=GITHUB_ACTIONS=true --setenv="TDH_SOURCE_COMMIT=$GITHUB_SHA" python3 tests/path_capacity_probe.py --output "$RUNNER_TEMP/capacity-evidence/metrics.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: path-capacity
          path: ${{ runner.temp }}/capacity-evidence/*.json
          retention-days: 14
