name: Bounded client small-write causality check
on:
  workflow_dispatch:
  push:
    branches: [dev/telemt-stable-compat-20261107]
    paths: [.github/workflows/client-nodelay.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch fixed binaries and disposable prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 42495175073 --repo bababoyi6/me --json headSha --jq .headSha)" = dec285fbdf5b42dd8be3e9e879bc0c2ad8994bc8
          timeout 90 gh run download 42495175073 --repo bababoyi6/me --name native-pair --dir "$RUNNER_TEMP/native-pair"
          timeout 90 gh api -H 'Accept: application/octet-stream' repos/bababoyi6/me/releases/assets/672609415 > "$RUNNER_TEMP/balanced2.tar.gz"
          timeout 90 gh api -H 'Accept: application/octet-stream' repos/telemt/telemt/releases/assets/723821981 > "$RUNNER_TEMP/stable.tar.gz"
          sudo timeout 120 apt-get update -qq
          sudo timeout 180 apt-get install -y --no-install-recommends haproxy iproute2 python3-cryptography
          mkdir -m 700 "$RUNNER_TEMP/client-nodelay"
      - name: Change one client socket flag and retain every measured transfer
        run: |
          sudo systemd-run --quiet --wait --pipe --collect --unit="tdh-paired-nodelay-${GITHUB_RUN_ID}" -p CPUQuota=200% -p MemoryMax=512M -p MemorySwapMax=0 -p TasksMax=256 -p RuntimeMaxSec=180 -p "WorkingDirectory=$GITHUB_WORKSPACE" --setenv=GITHUB_ACTIONS=true --setenv="TDH_SOURCE_COMMIT=$GITHUB_SHA" unshare --net sh -c 'ip link set lo up; exec python3 tests/client_nodelay_lab.py --balanced2-archive "$1/balanced2.tar.gz" --stable-archive "$1/stable.tar.gz" --native-directory "$1/native-pair" --output "$1/client-nodelay/result.json"' lab "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-nodelay-evidence
          path: ${{ runner.temp }}/client-nodelay/*.json
          retention-days: 14
