name: Targeted weak-network failure diagnosis

on:
  workflow_dispatch:
  push:
    branches: [dev/telemt-stable-compat-20261107]
    paths:
      - tests/weak_network_diagnostic.py
      - .github/workflows/weak-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: targeted-weak-diagnosis
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Prepare maintained lab dependencies
        run: |
          sudo timeout 120 apt-get update -qq
          sudo timeout 180 apt-get install -y --no-install-recommends haproxy python3-cryptography iproute2
      - name: Fetch pinned artifacts
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/weak-evidence"
          curl -q -fL --proto '=https' --proto-redir '=https' --tlsv1.2 --connect-timeout 10 --max-time 120 --max-filesize 67108864 https://github.com/telemt/telemt/releases/download/3.5.16/telemt-x86_64-linux-gnu.tar.gz -o "$RUNNER_TEMP/stable.tar.gz"
          curl -q -fL --proto '=https' --proto-redir '=https' --tlsv1.2 --connect-timeout 10 --max-time 120 --max-filesize 67108864 https://github.com/bababoyi6/me/releases/download/telemt-core-3.5.5-tdh.balanced2/telemt-3.5.5-tdh.balanced2-x86_64-linux-gnu.tar.gz -o "$RUNNER_TEMP/balanced2.tar.gz"
      - name: Diagnose genuine protocol EOF with both fast paths
        run: |
          sudo systemd-run --quiet --wait --pipe --collect --unit="tdh-paired-weak-${GITHUB_RUN_ID}" -p CPUQuota=200% -p MemoryMax=1536M -p MemoryHigh=1200M -p MemorySwapMax=0 -p TasksMax=512 -p RuntimeMaxSec=900 -p OOMPolicy=stop -p "WorkingDirectory=$GITHUB_WORKSPACE" --setenv="TDH_SOURCE_COMMIT=$GITHUB_SHA" /usr/bin/unshare --net sh -c 'set -e; ip link set lo up; exec python3 tests/weak_network_diagnostic.py --stable-archive "$1/stable.tar.gz" --balanced2-archive "$1/balanced2.tar.gz" --output "$1/weak-evidence/diagnostic.json"' lab "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeted-weak-evidence
          path: ${{ runner.temp }}/weak-evidence/*.json
          if-no-files-found: warn
          retention-days: 14
