name: Preserve fixture and inspect weak-network exceptions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exception-only-observer
  cancel-in-progress: false

jobs:
  inspect:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare bounded disposable dependencies
        run: |
          sudo timeout 120 apt-get update -qq
          sudo timeout 180 apt-get install -y --no-install-recommends haproxy python3-cryptography iproute2
      - name: Fetch exact releases
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/exception-evidence"
          curl -q -fL --proto '=https' --proto-redir '=https' --tlsv1.2 --connect-timeout 10 --max-time 120 --max-filesize 67108864 https://github.com/telemt/telemt/releases/download/3.5.16/telemt-x86_64-linux-gnu.tar.gz -o "$RUNNER_TEMP/stable.tar.gz"
          curl -q -fL --proto '=https' --proto-redir '=https' --tlsv1.2 --connect-timeout 10 --max-time 120 --max-filesize 67108864 https://github.com/bababoyi6/me/releases/download/telemt-core-3.5.5-tdh.balanced2/telemt-3.5.5-tdh.balanced2-x86_64-linux-gnu.tar.gz -o "$RUNNER_TEMP/balanced2.tar.gz"
      - name: Repeat full sequence without changing successful transfers
        run: |
          sudo systemd-run --quiet --wait --pipe --collect --unit="tdh-paired-exception-${GITHUB_RUN_ID}" -p CPUQuota=200% -p MemoryMax=1536M -p MemoryHigh=1200M -p MemorySwapMax=0 -p TasksMax=512 -p RuntimeMaxSec=1500 -p OOMPolicy=stop -p "WorkingDirectory=$GITHUB_WORKSPACE" --setenv="TDH_SOURCE_COMMIT=$GITHUB_SHA" --setenv="ImageVersion=$ImageVersion" /usr/bin/unshare --net sh -c 'set -e; ip link set lo up; exec python3 tests/exception_only_diagnostic.py --stable-archive "$1/stable.tar.gz" --balanced2-archive "$1/balanced2.tar.gz" --output "$1/exception-evidence/replica-1.json" --replica 1' lab "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exception-only-diagnostic-${{ matrix.os }}
          path: ${{ runner.temp }}/exception-evidence/*.json
          if-no-files-found: warn
          retention-days: 14
