name: Build and qualify optional native stable socket port
on:
  workflow_dispatch:
    inputs:
      tls_candidate:
        description: Select an isolated audit check
        type: choice
        options: ['focused', 'none', 'manager', 'old', 'new', 'new-mixed', 'new-queue', 'new-dual', 'new-gigabit', 'gigabit-control', 'gigabit-proxy-window', 'new-client-lowat', 'gigabit-tunnel-budget', 'gigabit-tunnel-proxy']
        default: 'focused'
      tls_parity:
        description: Also run the bounded 100 ms AB/BA throughput screen after protocol smoke
        type: boolean
        default: false
      dual_recovery_only:
        description: For new-dual, verify only route withdrawal and recovery
        type: boolean
        default: false
  push:
    branches: [dev/telemt-stable-compat-20261107]
    paths:
      - .github/workflows/stable-candidate.yml
permissions:
  contents: read
concurrency:
  group: stable-native-candidate
  cancel-in-progress: false
jobs:
  gigabit-control:
    if: startsWith(inputs.tls_candidate, 'gigabit-')
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Measure the effect of private TCP autotuning ceilings
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
          TEST_MODE: ${{ inputs.tls_candidate }}
        run: |
          sudo timeout 120 apt-get update -qq
          sudo timeout 180 apt-get install -y --no-install-recommends wireguard-tools ethtool iperf3 python3-cryptography
          sudo modprobe tcp_bbr
          if [[ $TEST_MODE == gigabit-tunnel-* ]]; then
            args=("$RUNNER_TEMP/gigabit-control.json")
            if [[ $TEST_MODE == gigabit-tunnel-proxy ]]; then
              sudo timeout 180 apt-get install -y --no-install-recommends haproxy
              curl -q -fL --connect-timeout 10 --max-time 90 --max-filesize 11000000 --proto '=https' --proto-redir '=https' --tlsv1.2 https://github.com/bababoyi6/me/releases/download/telemt-core-3.5.5-tdh.balanced2/telemt-3.5.5-tdh.balanced2-x86_64-linux-gnu.tar.gz -o "$RUNNER_TEMP/balanced2.tar.gz"
              args+=("$RUNNER_TEMP/balanced2.tar.gz")
            fi
            sudo systemd-run --quiet --wait --pipe --collect --unit="tdh-paired-tunnel-budget-${GITHUB_RUN_ID}" -p CPUQuota=400% -p MemoryMax=2048M -p MemoryHigh=1700M -p MemorySwapMax=0 -p TasksMax=512 -p RuntimeMaxSec=360 -p OOMPolicy=stop -p "WorkingDirectory=$GITHUB_WORKSPACE" --setenv=GITHUB_ACTIONS=true --setenv="TDH_SOURCE_COMMIT=$GITHUB_SHA" --setenv="PYTHONPATH=$PYTHONPATH" python3 tests/tunnel_budget_lab.py "${args[@]}"
            exit
          fi
          args=(--control-only)
          if [[ $TEST_MODE == gigabit-proxy-window ]]; then
            sudo timeout 180 apt-get install -y --no-install-recommends haproxy
            curl -q -fL --connect-timeout 10 --max-time 90 --max-filesize 11000000 --proto '=https' --proto-redir '=https' --tlsv1.2 https://github.com/bababoyi6/me/releases/download/telemt-core-3.5.5-tdh.balanced2/telemt-3.5.5-tdh.balanced2-x86_64-linux-gnu.tar.gz -o "$RUNNER_TEMP/balanced2.tar.gz"
            args=(--proxy-window --balanced2-archive "$RUNNER_TEMP/balanced2.tar.gz")
          fi
          sudo systemd-run --quiet --wait --pipe --collect --unit="tdh-paired-gigabit-control-${GITHUB_RUN_ID}" -p CPUQuota=400% -p MemoryMax=2048M -p MemoryHigh=1700M -p MemorySwapMax=0 -p TasksMax=512 -p RuntimeMaxSec=600 -p OOMPolicy=stop -p "WorkingDirectory=$GITHUB_WORKSPACE" --setenv=GITHUB_ACTIONS=true --setenv="TDH_SOURCE_COMMIT=$GITHUB_SHA" --setenv="PYTHONPATH=$PYTHONPATH" python3 tests/gigabit_lab.py "${args[@]}" --output "$RUNNER_TEMP/gigabit-control.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gigabit-control
          path: ${{ runner.temp }}/gigabit-control.json
          retention-days: 7
  build:
    if: inputs.tls_candidate == 'none' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: telemt/telemt
          ref: 66708d2866f3f3a4541c4fa67984d408e71a8af4
          path: upstream
          persist-credentials: false
      - name: Prepare pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update && rustup default 1.99.1
      - name: Build and test same-toolchain native controls
        run: timeout --kill-after=10 1700 python3 tools/build_stable_candidate.py --source upstream --output "$RUNNER_TEMP/native-pair"
      - uses: actions/upload-artifact@v4
        with:
          name: native-pair
          path: ${{ runner.temp }}/native-pair/
          retention-days: 7
          if-no-files-found: error
  measure:
    if: inputs.tls_candidate == 'none' || github.event_name == 'push'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-pair
          path: ${{ runner.temp }}/native-pair
      - name: Prepare disposable dependencies
        run: |
          sudo timeout 120 apt-get update -qq
          sudo timeout 180 apt-get install -y --no-install-recommends haproxy iproute2 wireguard-tools ethtool iperf3 python3-cryptography
          mkdir -m 700 "$RUNNER_TEMP/native-evidence"
      - name: Compare native single-core high-RTT WG relays in four AB BA rounds
        run: |
          sudo systemd-run --quiet --wait --pipe --collect --unit="tdh-paired-nativepath-${GITHUB_RUN_ID}" -p CPUQuota=300% -p MemoryMax=1536M -p MemoryHigh=1200M -p MemorySwapMax=0 -p TasksMax=512 -p RuntimeMaxSec=900 -p OOMPolicy=stop -p "WorkingDirectory=$GITHUB_WORKSPACE" --setenv="GITHUB_ACTIONS=true" --setenv="TDH_SOURCE_COMMIT=$GITHUB_SHA" python3 tests/long_path_lab.py --native-directory "$RUNNER_TEMP/native-pair" --output "$RUNNER_TEMP/native-evidence/metrics.json"
          python3 tests/long_path_analysis.py "$RUNNER_TEMP/native-evidence/metrics.json" "$RUNNER_TEMP/native-evidence/analysis.json"
      - name: Fetch exact legacy rollback fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout 90 gh api -H 'Accept: application/octet-stream' repos/bababoyi6/me/releases/assets/672609415 > "$RUNNER_TEMP/balanced2.tar.gz"
      - name: Verify native systemd maintenance and exact legacy rollback
        run: |
          sudo env GITHUB_ACTIONS=true timeout --kill-after=10 240 unshare --net sh -c 'ip link set lo up; exec python3 tests/stable_system_lab.py --candidate-directory "$1/native-pair" --balanced2-archive "$1/balanced2.tar.gz" --output "$1/native-evidence/system.json"' native "$RUNNER_TEMP"
      - name: Validate native 30 50 100 concurrency and idle recovery inside one CPU and 768MiB
        run: |
          sudo systemd-run --quiet --wait --pipe --collect --unit="tdh-paired-nativeprotocol-${GITHUB_RUN_ID}" -p CPUQuota=100% -p MemoryMax=768M -p MemorySwapMax=0 -p TasksMax=512 -p RuntimeMaxSec=180 -p OOMPolicy=stop -p "WorkingDirectory=$GITHUB_WORKSPACE" --setenv="GITHUB_ACTIONS=true" --setenv="TDH_SOURCE_COMMIT=$GITHUB_SHA" unshare --net -- bash -c 'ip link set lo up; tc qdisc add dev lo root netem delay 25ms rate 100mbit limit 10000; exec python3 tests/native_socket_acceptance.py --directory "$1" --output "$2"' native "$RUNNER_TEMP/native-pair" "$RUNNER_TEMP/native-evidence/protocol.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-socket-evidence
          path: ${{ runner.temp }}/native-evidence/*.json
          retention-days: 14
  manager-update:
    if: inputs.tls_candidate == 'manager' || inputs.tls_candidate == 'focused'
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare syntax checker
        run: |
          sudo timeout 90 apt-get update -qq
          sudo timeout 120 apt-get install -y --no-install-recommends shellcheck
      - name: Verify release updater and rollback against private fixtures
        run: |
          bash -n telemt-dual-hop.sh
          shellcheck -x -S style telemt-dual-hop.sh
          python3 -m unittest discover -s tests -p 'test_release_lock.py' -v
          timeout --kill-after=5 40 python3 -m unittest discover -s tests -p 'test_install_command.py' -v
          sudo timeout --kill-after=5 60 python3 -m unittest discover -s tests -p 'test_manager_lifecycle.py' -v
          sudo timeout --kill-after=5 60 python3 -m unittest discover -s tests -p 'test_performance.py' -k manager -k test_update_ -k test_shortcut_failure -k test_stalled_selftest -v
  tls-candidate:
    needs: manager-update
    if: >-
      ${{ !cancelled() && (
        (inputs.tls_candidate == 'focused' && needs.manager-update.result == 'success') ||
        inputs.tls_candidate == 'old' || startsWith(inputs.tls_candidate, 'new')
      ) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 44
    env:
      CANDIDATE_KIND: ${{ startsWith(inputs.tls_candidate, 'new') && 'new' || 'old' }}
      UPSTREAM_COMMIT: ${{ startsWith(inputs.tls_candidate, 'new') && 'b594ee55270798fe21f23b721b50eab46c2e0bec' || 'ac71d92ec41dea00a7eafd6b8d350c3486633500' }}
      FOLLOWUP_SCREEN: ${{ startsWith(inputs.tls_candidate, 'new-') }}
      PYTHONPATH: ${{ github.workspace }}/tools
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: telemt/telemt
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream
          persist-credentials: false
      - name: Prepare pinned Rust and disposable dependencies
        run: |
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          rustup default 1.99.1
          sudo timeout 120 apt-get update -qq
          sudo timeout 180 apt-get install -y --no-install-recommends haproxy iproute2 python3-cryptography
          mkdir -m 700 "$RUNNER_TEMP/tls-evidence"
      - name: Build and test one candidate
        run: |
          if [[ $CANDIDATE_KIND == old ]]; then
            timeout --kill-after=10 1400 python3 tools/build_relay_candidate.py --source upstream --output "$RUNNER_TEMP/tls-core" --candidate balanced2-security
          elif [[ $FOLLOWUP_SCREEN == true ]]; then
            timeout --kill-after=10 1400 python3 tools/build_stable_candidate.py --source upstream --output "$RUNNER_TEMP/tls-core" --security-main --build-only
          else
            timeout --kill-after=10 1400 python3 tools/build_stable_candidate.py --source upstream --output "$RUNNER_TEMP/tls-core" --security-main
          fi
      - name: Fetch fixed released baseline
        if: inputs.tls_candidate != 'new-dual' && inputs.tls_candidate != 'new-client-lowat'
        run: |
          curl -q -fL --connect-timeout 10 --max-time 90 --max-filesize 11000000 --proto '=https' --proto-redir '=https' --tlsv1.2 https://github.com/bababoyi6/me/releases/download/telemt-core-3.5.5-tdh.balanced2/telemt-3.5.5-tdh.balanced2-x86_64-linux-gnu.tar.gz -o "$RUNNER_TEMP/balanced2.tar.gz"
          printf '%s  %s\n' b4fec3efd10288a9f211ad958337fa314a15486e72fd5c50ab870f22a19737e5 "$RUNNER_TEMP/balanced2.tar.gz" | sha256sum --check
      - name: Verify both synthetic links and the local API boundary
        if: env.FOLLOWUP_SCREEN != 'true'
        run: |
          sudo systemd-run --quiet --wait --pipe --collect --unit="tdh-paired-tls-${GITHUB_RUN_ID}" -p CPUQuota=100% -p MemoryMax=512M -p MemorySwapMax=0 -p TasksMax=128 -p RuntimeMaxSec=120 -p OOMPolicy=stop -p "WorkingDirectory=$GITHUB_WORKSPACE" --setenv=GITHUB_ACTIONS=true --setenv="TDH_SOURCE_COMMIT=$GITHUB_SHA" --setenv="PYTHONPATH=$PYTHONPATH" unshare --net -- sh -ec 'ip link set lo up; exec python3 tests/tls_candidate_lab.py --kind "$1" --candidate "$2/tls-core" --balanced2-archive "$2/balanced2.tar.gz" --output "$2/tls-evidence/protocol.json"' tls "$CANDIDATE_KIND" "$RUNNER_TEMP"
      - name: Compare released baseline and candidate on the same 100 ms WireGuard path
        if: env.FOLLOWUP_SCREEN != 'true' && (inputs.tls_parity || inputs.tls_candidate == 'focused')
        run: |
          sudo timeout 180 apt-get install -y --no-install-recommends wireguard-tools ethtool iperf3
          sudo systemd-run --quiet --wait --pipe --collect --unit="tdh-paired-tls-parity-${GITHUB_RUN_ID}" -p CPUQuota=300% -p MemoryMax=1536M -p MemoryHigh=1200M -p MemorySwapMax=0 -p TasksMax=512 -p RuntimeMaxSec=420 -p OOMPolicy=stop -p "WorkingDirectory=$GITHUB_WORKSPACE" --setenv=GITHUB_ACTIONS=true --setenv="TDH_SOURCE_COMMIT=$GITHUB_SHA" --setenv="PYTHONPATH=$PYTHONPATH" python3 tests/long_path_lab.py --tls-candidate "$CANDIDATE_KIND" --native-directory "$RUNNER_TEMP/tls-core" --balanced2-archive "$RUNNER_TEMP/balanced2.tar.gz" --output "$RUNNER_TEMP/tls-evidence/parity.json"
          python3 tests/long_path_analysis.py --require-initial-screen "$RUNNER_TEMP/tls-evidence/parity.json" "$RUNNER_TEMP/tls-evidence/analysis.json"
      - name: Compare 30 mixed connections on the same 100 ms WireGuard path
        if: inputs.tls_candidate == 'new-mixed'
        run: |
          sudo timeout 180 apt-get install -y --no-install-recommends wireguard-tools ethtool iperf3
          sudo modprobe tcp_bbr
          sudo systemd-run --quiet --wait --pipe --collect --unit="tdh-paired-tls-mixed-${GITHUB_RUN_ID}" -p CPUQuota=300% -p MemoryMax=1536M -p MemoryHigh=1200M -p MemorySwapMax=0 -p TasksMax=512 -p RuntimeMaxSec=540 -p OOMPolicy=stop -p "WorkingDirectory=$GITHUB_WORKSPACE" --setenv=GITHUB_ACTIONS=true --setenv="TDH_SOURCE_COMMIT=$GITHUB_SHA" --setenv="PYTHONPATH=$PYTHONPATH" python3 tests/mixed_path_lab.py --new-tls-candidate --profile rtt100 --native-directory "$RUNNER_TEMP/tls-core" --balanced2-archive "$RUNNER_TEMP/balanced2.tar.gz" --output "$RUNNER_TEMP/tls-evidence/mixed.json"
          python3 tests/mixed_experience_analysis.py --require-parity "$RUNNER_TEMP/tls-evidence/mixed.json" "$RUNNER_TEMP/tls-evidence/mixed-analysis.json"
      - name: Compare original and pre-encryption queues on the exact x86 candidate
        if: inputs.tls_candidate == 'new-queue'
        run: |
          printf '%s  %s\n' 6e752224b2018b2f16ce1b0dd355a20f9d79c8e64741c870df28f1189c607673 "$RUNNER_TEMP/tls-core/telemt-balanced" | sha256sum --check
          sudo timeout 180 apt-get install -y --no-install-recommends wireguard-tools ethtool iperf3
          sudo modprobe tcp_bbr
          sudo systemd-run --quiet --wait --pipe --collect --unit="tdh-paired-tls-queue-${GITHUB_RUN_ID}" -p CPUQuota=300% -p MemoryMax=1536M -p MemoryHigh=1200M -p MemorySwapMax=0 -p TasksMax=512 -p RuntimeMaxSec=540 -p OOMPolicy=stop -p "WorkingDirectory=$GITHUB_WORKSPACE" --setenv=GITHUB_ACTIONS=true --setenv="TDH_SOURCE_COMMIT=$GITHUB_SHA" --setenv="PYTHONPATH=$PYTHONPATH" python3 tests/mixed_path_lab.py --new-tls-queue --profile rtt100 --native-directory "$RUNNER_TEMP/tls-core" --balanced2-archive "$RUNNER_TEMP/balanced2.tar.gz" --output "$RUNNER_TEMP/tls-evidence/queue.json"
          python3 tests/private_shaper_analysis.py --require-gain "$RUNNER_TEMP/tls-evidence/queue.json" "$RUNNER_TEMP/tls-evidence/queue-analysis.json"
      - name: Compare two active tunnels and reclaim capacity after maintenance failover
        if: inputs.tls_candidate == 'new-dual'
        env:
          RECOVERY_ONLY: ${{ inputs.dual_recovery_only }}
        run: |
          sudo timeout 180 apt-get install -y --no-install-recommends wireguard-tools ethtool
          sudo modprobe tcp_bbr
          args=()
          if [[ $RECOVERY_ONLY == true ]]; then args+=(--recovery-only); fi
          sudo systemd-run --quiet --wait --pipe --collect --unit="tdh-paired-tls-dual-${GITHUB_RUN_ID}" -p CPUQuota=300% -p MemoryMax=1536M -p MemoryHigh=1200M -p MemorySwapMax=0 -p TasksMax=512 -p RuntimeMaxSec=540 -p OOMPolicy=stop -p "WorkingDirectory=$GITHUB_WORKSPACE" --setenv=GITHUB_ACTIONS=true --setenv="TDH_SOURCE_COMMIT=$GITHUB_SHA" --setenv="PYTHONPATH=$PYTHONPATH" python3 tests/dual_queue_lab.py --candidate "$RUNNER_TEMP/tls-core" --output "$RUNNER_TEMP/tls-evidence/dual.json" "${args[@]}"
      - name: Measure TCP, WireGuard, and proxy on the same gigabit path
        if: inputs.tls_candidate == 'new-gigabit'
        run: |
          sudo timeout 180 apt-get install -y --no-install-recommends wireguard-tools ethtool iperf3
          sudo modprobe tcp_bbr
          sudo systemd-run --quiet --wait --pipe --collect --unit="tdh-paired-gigabit-${GITHUB_RUN_ID}" -p CPUQuota=400% -p MemoryMax=2048M -p MemoryHigh=1700M -p MemorySwapMax=0 -p TasksMax=512 -p RuntimeMaxSec=840 -p OOMPolicy=stop -p "WorkingDirectory=$GITHUB_WORKSPACE" --setenv=GITHUB_ACTIONS=true --setenv="TDH_SOURCE_COMMIT=$GITHUB_SHA" --setenv="PYTHONPATH=$PYTHONPATH" python3 tests/gigabit_lab.py --candidate "$RUNNER_TEMP/tls-core" --balanced2-archive "$RUNNER_TEMP/balanced2.tar.gz" --output "$RUNNER_TEMP/tls-evidence/gigabit.json"
      - name: Build the client send backlog variant on the same dependencies
        if: inputs.tls_candidate == 'new-client-lowat'
        run: |
          git -C upstream restore -- Cargo.toml Cargo.lock src/transport/socket.rs src/transport/socket/tests.rs
          rm -f -- upstream/src/transport/socket/{low_rtt_receive,unsent_queue_bulk}.rs
          timeout --kill-after=10 1400 python3 tools/build_stable_candidate.py --source upstream --output "$RUNNER_TEMP/tls-lowat" --security-main --client-unsent-limit
      - name: Measure the client send backlog option at 100 ms
        if: inputs.tls_candidate == 'new-client-lowat'
        run: |
          sudo timeout 180 apt-get install -y --no-install-recommends wireguard-tools ethtool iperf3
          sudo modprobe tcp_bbr
          sudo systemd-run --quiet --wait --pipe --collect --unit="tdh-paired-client-lowat-${GITHUB_RUN_ID}" -p CPUQuota=400% -p MemoryMax=2048M -p MemoryHigh=1700M -p MemorySwapMax=0 -p TasksMax=512 -p RuntimeMaxSec=450 -p OOMPolicy=stop -p "WorkingDirectory=$GITHUB_WORKSPACE" --setenv=GITHUB_ACTIONS=true --setenv="TDH_SOURCE_COMMIT=$GITHUB_SHA" --setenv="PYTHONPATH=$PYTHONPATH" python3 tests/gigabit_lab.py --candidate "$RUNNER_TEMP/tls-core" --client-lowat "$RUNNER_TEMP/tls-lowat" --output "$RUNNER_TEMP/tls-evidence/client-lowat.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tls-candidate-evidence
          path: |
            ${{ runner.temp }}/tls-evidence/*.json
            ${{ runner.temp }}/tls-core/manifest.json
            ${{ runner.temp }}/tls-core/tls-before.log
            ${{ runner.temp }}/tls-lowat/manifest.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success() && github.event.repository.private && env.CANDIDATE_KIND == 'old'
        with:
          name: balanced2-security-build
          path: |
            ${{ runner.temp }}/tls-core.tar.gz
            ${{ runner.temp }}/tls-core.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
