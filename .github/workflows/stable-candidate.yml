name: Build and qualify optional native stable socket port
on:
  workflow_dispatch:
    inputs:
      tls_candidate:
        description: Select an isolated audit check
        type: choice
        options: ['none', 'manager', 'old', 'new']
        default: 'none'
      tls_parity:
        description: Also run the bounded 100 ms AB/BA throughput screen after protocol smoke
        type: boolean
        default: false
  push:
    branches: [dev/telemt-stable-compat-20261107]
    paths:
      - .github/workflows/stable-candidate.yml
permissions:
  contents: read
concurrency:
  group: stable-native-candidate
  cancel-in-progress: false
jobs:
  build:
    if: inputs.tls_candidate == 'none' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: telemt/telemt
          ref: 66708d2866f3f3a4541c4fa67984d408e71a8af4
          path: upstream
          persist-credentials: false
      - name: Prepare pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update && rustup default 1.99.1
      - name: Build and test same-toolchain native controls
        run: timeout --kill-after=10 1700 python3 tools/build_stable_candidate.py --source upstream --output "$RUNNER_TEMP/native-pair"
      - uses: actions/upload-artifact@v4
        with:
          name: native-pair
          path: ${{ runner.temp }}/native-pair/
          retention-days: 7
          if-no-files-found: error
  measure:
    if: inputs.tls_candidate == 'none' || github.event_name == 'push'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-pair
          path: ${{ runner.temp }}/native-pair
      - name: Prepare disposable dependencies
        run: |
          sudo timeout 120 apt-get update -qq
          sudo timeout 180 apt-get install -y --no-install-recommends haproxy iproute2 wireguard-tools ethtool iperf3 python3-cryptography
          mkdir -m 700 "$RUNNER_TEMP/native-evidence"
      - name: Compare native single-core high-RTT WG relays in four AB BA rounds
        run: |
          sudo systemd-run --quiet --wait --pipe --collect --unit="tdh-paired-nativepath-${GITHUB_RUN_ID}" -p CPUQuota=300% -p MemoryMax=1536M -p MemoryHigh=1200M -p MemorySwapMax=0 -p TasksMax=512 -p RuntimeMaxSec=900 -p OOMPolicy=stop -p "WorkingDirectory=$GITHUB_WORKSPACE" --setenv="GITHUB_ACTIONS=true" --setenv="TDH_SOURCE_COMMIT=$GITHUB_SHA" python3 tests/long_path_lab.py --native-directory "$RUNNER_TEMP/native-pair" --output "$RUNNER_TEMP/native-evidence/metrics.json"
          python3 tests/long_path_analysis.py "$RUNNER_TEMP/native-evidence/metrics.json" "$RUNNER_TEMP/native-evidence/analysis.json"
      - name: Fetch exact legacy rollback fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout 90 gh api -H 'Accept: application/octet-stream' repos/bababoyi6/me/releases/assets/672609415 > "$RUNNER_TEMP/balanced2.tar.gz"
      - name: Verify native systemd maintenance and exact legacy rollback
        run: |
          sudo env GITHUB_ACTIONS=true timeout --kill-after=10 240 unshare --net sh -c 'ip link set lo up; exec python3 tests/stable_system_lab.py --candidate-directory "$1/native-pair" --balanced2-archive "$1/balanced2.tar.gz" --output "$1/native-evidence/system.json"' native "$RUNNER_TEMP"
      - name: Validate native 30 50 100 concurrency and idle recovery inside one CPU and 768MiB
        run: |
          sudo systemd-run --quiet --wait --pipe --collect --unit="tdh-paired-nativeprotocol-${GITHUB_RUN_ID}" -p CPUQuota=100% -p MemoryMax=768M -p MemorySwapMax=0 -p TasksMax=512 -p RuntimeMaxSec=180 -p OOMPolicy=stop -p "WorkingDirectory=$GITHUB_WORKSPACE" --setenv="GITHUB_ACTIONS=true" --setenv="TDH_SOURCE_COMMIT=$GITHUB_SHA" unshare --net -- bash -c 'ip link set lo up; tc qdisc add dev lo root netem delay 25ms rate 100mbit limit 10000; exec python3 tests/native_socket_acceptance.py --directory "$1" --output "$2"' native "$RUNNER_TEMP/native-pair" "$RUNNER_TEMP/native-evidence/protocol.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-socket-evidence
          path: ${{ runner.temp }}/native-evidence/*.json
          retention-days: 14
  manager-update:
    if: inputs.tls_candidate == 'manager'
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare syntax checker
        run: |
          sudo timeout 90 apt-get update -qq
          sudo timeout 120 apt-get install -y --no-install-recommends shellcheck
      - name: Verify release updater and rollback against private fixtures
        run: |
          bash -n telemt-dual-hop.sh
          shellcheck -x -S style telemt-dual-hop.sh
          python3 -m unittest discover -s tests -p 'test_release_lock.py' -v
          timeout --kill-after=5 40 python3 -m unittest discover -s tests -p 'test_install_command.py' -v
          sudo timeout --kill-after=5 60 python3 -m unittest discover -s tests -p 'test_manager_lifecycle.py' -v
          sudo timeout --kill-after=5 60 python3 -m unittest discover -s tests -p 'test_performance.py' -k manager -v
  tls-candidate:
    if: inputs.tls_candidate == 'old' || inputs.tls_candidate == 'new'
    runs-on: ubuntu-22.04
    timeout-minutes: 44
    env:
      CANDIDATE_KIND: ${{ inputs.tls_candidate }}
      UPSTREAM_COMMIT: ${{ inputs.tls_candidate == 'old' && 'ac71d92ec41dea00a7eafd6b8d350c3486633500' || 'b594ee55270798fe21f23b721b50eab46c2e0bec' }}
      PYTHONPATH: ${{ github.workspace }}/tools
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: telemt/telemt
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream
          persist-credentials: false
      - name: Prepare pinned Rust and disposable dependencies
        run: |
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          rustup default 1.99.1
          sudo timeout 120 apt-get update -qq
          sudo timeout 180 apt-get install -y --no-install-recommends haproxy iproute2 python3-cryptography
          mkdir -m 700 "$RUNNER_TEMP/tls-evidence"
      - name: Build and test one candidate
        run: |
          if [[ $CANDIDATE_KIND == old ]]; then
            timeout --kill-after=10 1400 python3 tools/build_relay_candidate.py --source upstream --output "$RUNNER_TEMP/tls-core" --candidate balanced2-security
          else
            timeout --kill-after=10 1400 python3 tools/build_stable_candidate.py --source upstream --output "$RUNNER_TEMP/tls-core" --security-main
          fi
      - name: Fetch fixed released baseline
        run: |
          curl -q -fL --connect-timeout 10 --max-time 90 --max-filesize 11000000 --proto '=https' --proto-redir '=https' --tlsv1.2 https://github.com/bababoyi6/me/releases/download/telemt-core-3.5.5-tdh.balanced2/telemt-3.5.5-tdh.balanced2-x86_64-linux-gnu.tar.gz -o "$RUNNER_TEMP/balanced2.tar.gz"
          printf '%s  %s\n' b4fec3efd10288a9f211ad958337fa314a15486e72fd5c50ab870f22a19737e5 "$RUNNER_TEMP/balanced2.tar.gz" | sha256sum --check
      - name: Verify both synthetic links and the local API boundary
        run: |
          sudo systemd-run --quiet --wait --pipe --collect --unit="tdh-paired-tls-${GITHUB_RUN_ID}" -p CPUQuota=100% -p MemoryMax=512M -p MemorySwapMax=0 -p TasksMax=128 -p RuntimeMaxSec=120 -p OOMPolicy=stop -p "WorkingDirectory=$GITHUB_WORKSPACE" --setenv=GITHUB_ACTIONS=true --setenv="TDH_SOURCE_COMMIT=$GITHUB_SHA" --setenv="PYTHONPATH=$PYTHONPATH" unshare --net -- sh -ec 'ip link set lo up; exec python3 tests/tls_candidate_lab.py --kind "$1" --candidate "$2/tls-core" --balanced2-archive "$2/balanced2.tar.gz" --output "$2/tls-evidence/protocol.json"' tls "$CANDIDATE_KIND" "$RUNNER_TEMP"
      - name: Compare released baseline and candidate on the same 100 ms WireGuard path
        if: inputs.tls_parity
        run: |
          sudo timeout 180 apt-get install -y --no-install-recommends wireguard-tools ethtool iperf3
          sudo systemd-run --quiet --wait --pipe --collect --unit="tdh-paired-tls-parity-${GITHUB_RUN_ID}" -p CPUQuota=300% -p MemoryMax=1536M -p MemoryHigh=1200M -p MemorySwapMax=0 -p TasksMax=512 -p RuntimeMaxSec=420 -p OOMPolicy=stop -p "WorkingDirectory=$GITHUB_WORKSPACE" --setenv=GITHUB_ACTIONS=true --setenv="TDH_SOURCE_COMMIT=$GITHUB_SHA" --setenv="PYTHONPATH=$PYTHONPATH" python3 tests/long_path_lab.py --tls-candidate "$CANDIDATE_KIND" --native-directory "$RUNNER_TEMP/tls-core" --balanced2-archive "$RUNNER_TEMP/balanced2.tar.gz" --output "$RUNNER_TEMP/tls-evidence/parity.json"
          python3 tests/long_path_analysis.py "$RUNNER_TEMP/tls-evidence/parity.json" "$RUNNER_TEMP/tls-evidence/analysis.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tls-candidate-evidence
          path: |
            ${{ runner.temp }}/tls-evidence/*.json
            ${{ runner.temp }}/tls-core/manifest.json
            ${{ runner.temp }}/tls-core/tls-before.log
          if-no-files-found: warn
          retention-days: 7
