name: Validate installer

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install local test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends haproxy shellcheck jq curl python3-cryptography iproute2
      - name: Check Bash syntax
        run: bash -n telemt-dual-hop.sh && for fixture in tests/fixtures/*.sh; do bash -n "$fixture"; done
      - name: Run ShellCheck
        run: shellcheck -x -S style telemt-dual-hop.sh tests/fixtures/*.sh
      - name: Run built-in tests
        run: bash telemt-dual-hop.sh --self-test
      - name: Check Python tools
        run: python3 -m compileall -q tests tools && python3 tools/embed_core_install.py --check && python3 tools/embed_health_agent.py --check
      - name: Test diagnostics, configuration and rollback
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify private shared core inode permissions and cleanup
        run: sudo timeout 20 python3 -m unittest discover -s tests -p 'test_lab_binary.py' -v
      - name: Verify real backend socket observations in private namespaces
        run: sudo timeout --kill-after=5 20 python3 -m unittest discover -s tests -p 'test_backend_observer.py' -v
      - name: Verify experimental socket policies on private loopback
        run: |
          cc -shared -fPIC -Wall -Wextra -Werror tests/socket_policy_lab.c -ldl -o "$RUNNER_TEMP/tdh-socket-policy.so"
          timeout 20 python3 tests/policy_oracle.py --library "$RUNNER_TEMP/tdh-socket-policy.so"
      - name: Test real HAProxy SNI and failover on loopback
        run: timeout 60 python3 tests/lab.py
      - name: Test install interruption recovery in isolated filesystems
        run: |
          sudo install -d -m 0700 "$RUNNER_TEMP/tdh-audit-recovery"
          sudo timeout 60 python3 tests/install_recovery_lab.py --root "$RUNNER_TEMP/tdh-audit-recovery"

  relay-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned Rust test toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - name: Test buffered relay progress, backpressure and error propagation
        run: cargo +1.99.1 test --locked --manifest-path tests/relay-flush-regression/Cargo.toml
