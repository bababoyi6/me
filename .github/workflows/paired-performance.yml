name: Paired core performance qualification

on:
  workflow_dispatch:
  push:
    branches: [dev/telemt-stable-compat-20261107]
    paths:
      - tests/paired_performance.py
      - tests/paired_analysis.py
      - tests/test_paired_analysis.py
      - tests/stable_acceptance.py
      - .github/workflows/paired-performance.yml

permissions:
  contents: read

concurrency:
  group: paired-performance
  cancel-in-progress: false

jobs:
  paired:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        replica: [1, 2]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare bounded ephemeral dependencies
        run: |
          sudo timeout 120 apt-get update -qq
          sudo timeout 180 apt-get install -y --no-install-recommends haproxy python3-cryptography iproute2
      - name: Fetch both exact release assets once
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/paired-evidence"
          curl -q -fL --proto '=https' --proto-redir '=https' --tlsv1.2 --connect-timeout 10 --max-time 120 --max-filesize 67108864 https://github.com/telemt/telemt/releases/download/3.5.16/telemt-x86_64-linux-gnu.tar.gz -o "$RUNNER_TEMP/stable.tar.gz"
          curl -q -fL --proto '=https' --proto-redir '=https' --tlsv1.2 --connect-timeout 10 --max-time 120 --max-filesize 67108864 https://github.com/bababoyi6/me/releases/download/telemt-core-3.5.5-tdh.balanced2/telemt-3.5.5-tdh.balanced2-x86_64-linux-gnu.tar.gz -o "$RUNNER_TEMP/balanced2.tar.gz"
          printf '%s  %s\n' e6f46b2f3becf29bfd555cec8a059e429f7c082c1af402499b3a7940cf8ebd34 "$RUNNER_TEMP/stable.tar.gz" b4fec3efd10288a9f211ad958337fa314a15486e72fd5c50ab870f22a19737e5 "$RUNNER_TEMP/balanced2.tar.gz" | sha256sum --check
      - name: Run balanced pairs with backend and generator on separate CPUs
        env:
          REPLICA: ${{ matrix.replica }}
        run: |
          sudo systemd-run --quiet --wait --pipe --collect --unit="tdh-paired-${GITHUB_RUN_ID}-${REPLICA}" -p CPUQuota=200% -p MemoryMax=1536M -p MemoryHigh=1200M -p MemorySwapMax=0 -p TasksMax=512 -p RuntimeMaxSec=1500 -p OOMPolicy=stop -p "WorkingDirectory=$GITHUB_WORKSPACE" --setenv="ImageVersion=$ImageVersion" --setenv="TDH_SOURCE_COMMIT=$GITHUB_SHA" /usr/bin/unshare --net sh -c 'set -e; ip link set lo up; exec python3 tests/paired_performance.py --stable-archive "$1/stable.tar.gz" --balanced2-archive "$1/balanced2.tar.gz" --output "$1/paired-evidence/replica-$2.json" --replica "$2"' lab "$RUNNER_TEMP" "$REPLICA"
      - name: Export only synthetic metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-performance-${{ matrix.replica }}
          path: ${{ runner.temp }}/paired-evidence/*.json
          if-no-files-found: warn
          retention-days: 14
